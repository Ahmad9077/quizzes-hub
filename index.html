<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="هيا نتعلم: التربية الإسلامية، اللغة العربية، English، الرياضيات، العلوم، الاجتماعيات.">
    <title>هيا نتعلم</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='3' width='22' height='26' rx='3' fill='%23cc4338'/%3E%3Crect x='21' y='3' width='6' height='26' rx='2' fill='%23151c2e'/%3E%3Ccircle cx='13' cy='13' r='4' fill='%23f4c95d'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=Cairo:wght@400..900&display=swap">
    <link rel="stylesheet" href="styles.css?v=20">
  </head>
  <body>
    <svg class="art-library" aria-hidden="true">
      <symbol id="art-mosque" viewBox="0 0 48 48"><path fill="currentColor" d="M24.6 2.5a5 5 0 1 0 3.9 8.4 4 4 0 1 1-3.9-8.4z"/><rect fill="currentColor" x="23.2" y="12" width="1.6" height="7"/><path fill="currentColor" d="M9.5 37c0-8.8 6.4-13.1 14.5-19 8.1 5.9 14.5 10.2 14.5 19z"/><path fill="currentColor" fill-rule="evenodd" d="M6 38.5h36V45H6zM24 40a3 3 0 0 0-3 3v2h6v-2a3 3 0 0 0-3-3z"/></symbol>
      <symbol id="art-sprout" viewBox="0 0 48 48"><path fill="currentColor" d="M22.5 45V25h3v20z"/><path fill="currentColor" d="M25 26c-.2-10 6.300-16 18-16 .2 10.500-6.300 16-18 16z"/><path fill="currentColor" d="M23 33c.2-7.800-5-12.500-16-12.500-.2 8.500 5 12.500 16 12.500z"/></symbol>
      <symbol id="art-flag" viewBox="0 0 60 30"><rect width="60" height="10" fill="#007a3d"/><rect y="10" width="60" height="10" fill="#fff"/><rect y="20" width="60" height="10" fill="#ce1126"/><path d="M0 0l15 10v10L0 30z" fill="#000"/></symbol>
    </svg>
    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-screen">
        <p>جاري التحميل…</p>
      </section>
    </main>

    <template id="setupTemplate">
      <section class="auth-layout">
        <article class="auth-card setup-card">
          <div>
            <p class="brand">هيا نتعلم</p>
            <h1>الإعداد مطلوب</h1>
          </div>
          <p>أضف رابط Supabase والمفتاح العام في <code>config.js</code>، ثم شغّل ملفات SQL ووظيفة Edge الموجودة في مجلد <code>supabase</code>.</p>
          <a class="primary-action" href="README.md">ملاحظات الإعداد</a>
        </article>
      </section>
    </template>

    <template id="loginTemplate">
      <section class="login">
        <div class="wall login-wall">
          <div class="sign-space">
            <h1 class="brand brand-large">هيا نتعلم</h1>
          </div>
          <div class="shelf">
            <ul class="books" aria-label="المواد">
              <li><div class="book" style="--c:#1f7a63;--h:104px;--i:0"><span class="art" aria-hidden="true"><svg><use href="#art-mosque"></use></svg></span><span class="name">التربية الإسلامية</span></div></li>
              <li><div class="book" style="--c:#cc4338;--h:96px;--i:1"><span class="art" aria-hidden="true">أ ب</span><span class="name">اللغة العربية</span></div></li>
              <li><div class="book" style="--c:#6e5aa6;--h:108px;--i:2"><span class="art" aria-hidden="true">Abc</span><span class="name">English</span></div></li>
              <li><div class="book is-light" style="--c:#f4c95d;--h:100px;--i:3"><span class="art" aria-hidden="true">١٢٣</span><span class="name">الرياضيات</span></div></li>
              <li><div class="book" style="--c:#0e7490;--h:108px;--i:4"><span class="art" aria-hidden="true"><svg><use href="#art-sprout"></use></svg></span><span class="name">العلوم</span></div></li>
              <li><div class="book" style="--c:#151c2e;--h:98px;--i:5"><span class="art" aria-hidden="true"><svg class="art-flag" viewBox="0 0 60 30"><use href="#art-flag"></use></svg></span><span class="name">الاجتماعيات</span></div></li>
            </ul>
          </div>
        </div>
        <div class="gate">
          <form class="login-form" id="loginForm">
            <label class="field">
              <span>اسم المستخدم</span>
              <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            </label>
            <label class="field">
              <span>كلمة المرور</span>
              <span class="input-wrap">
                <input class="pw" name="password" type="password" autocomplete="current-password" required>
                <button class="eye" id="togglePassword" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </span>
            </label>
            <button class="primary-action go" type="submit">دخول</button>
            <p class="form-message" id="loginMessage"></p>
          </form>
        </div>
      </section>
    </template>

    <template id="dashboardTemplate">
      <section class="dashboard">
        <div class="wall-band">
          <header class="topbar">
            <p class="brand">هيا نتعلم</p>
            <div class="topbar-actions">
              <button class="ghost-action" id="adminViewButton" type="button" hidden>الإدارة</button>
              <button class="ghost-action" id="logoutButton" type="button">تسجيل الخروج</button>
            </div>
          </header>

          <section class="student-hero">
            <div>
              <p class="student-kicker">صفحتي</p>
              <h1 id="dashboardTitle" class="page-title"></h1>
            </div>
            <nav class="dashboard-tabs" aria-label="أقسام الصفحة">
              <button class="tab-action active-tab" id="quizzesTabButton" type="button">الأنشطة</button>
              <button class="tab-action" id="challengeTabButton" type="button">التحدي</button>
            </nav>
          </section>
        </div>

        <div class="page-body">
        <section id="quizzesPanel">
          <h2 class="section-title">اختر اختبارا أو قصة</h2>
          <div class="quiz-grid" id="assignedQuizGrid"></div>
        </section>

        <section id="challengePanel" class="panel-gutter" hidden>
          <h2 class="section-title">وضع التحدي</h2>
          <div class="challenge-layout">
            <section class="challenge-card">
              <h3>ابدأ تحديا</h3>
              <form id="createChallengeForm" class="challenge-form">
                <label>
                  <span>الاختبار</span>
                  <select id="challengeQuizSelect" name="quizId" required></select>
                </label>
                <button class="primary-action" type="submit">أنشئ جلسة</button>
              </form>
              <p class="form-message" id="challengeCreateMessage"></p>
            </section>
          </div>

          <section class="challenge-card" id="activeChallengeCard" hidden>
            <div id="activeChallenge"></div>
          </section>

          <section class="challenge-card">
            <div class="section-heading-row">
              <h3>الجلسات المفتوحة</h3>
              <button class="mini-action" id="refreshChallengesButton" type="button">تحديث</button>
            </div>
            <div class="challenge-list" id="openChallengesList"></div>
          </section>
        </section>
        </div>
      </section>
    </template>

    <template id="quizTileTemplate">
      <a class="quiz-tile">
        <span class="quiz-icon" aria-hidden="true"></span>
        <span class="quiz-name"></span>
        <span class="start-pill">ابدأ</span>
      </a>
    </template>

    <template id="quranTileTemplate">
      <a class="quiz-tile quran-tile" href="quran/" lang="ar" dir="rtl" aria-label="القرآن الكريم — اختر السورة">
        <svg class="quiz-icon quran-thumbnail" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 17c-7-5-16-6-25-3v35c9-3 18-2 25 3 7-5 16-6 25-3V14c-9-3-18-2-25 3Zm0 0v35"/><path d="M15 24c4-1 7 0 10 2m-10 7c4-1 7 0 10 2m14-9c3-2 6-3 10-2m-10 11c3-2 6-3 10-2"/></svg>
        <span class="quiz-name">القرآن الكريم</span>
        <span class="start-pill">اختر السورة</span>
      </a>
    </template>

    <template id="storiesTileTemplate">
      <a class="quiz-tile stories-tile" href="prophets-stories.html" lang="ar" dir="rtl" aria-label="قصص الأنبياء — افتح القصص الخمس عشرة">
        <img class="quiz-icon stories-thumbnail" src="story-thumbnails/valley.webp" width="62" height="62" alt="">
        <span class="quiz-name">قصص الأنبياء</span>
        <span class="start-pill">افتح القصص · 15</span>
      </a>
    </template>

    <template id="adminTemplate">
      <section class="dashboard admin-dashboard">
        <div class="wall-band">
          <header class="topbar">
            <p class="brand">هيا نتعلم</p>
            <div class="topbar-actions">
              <button class="ghost-action" id="backToDashboardButton" type="button">صفحتي</button>
              <button class="ghost-action" id="adminLogoutButton" type="button">تسجيل الخروج</button>
            </div>
          </header>

          <div class="student-hero">
            <h1 class="page-title">الإدارة</h1>
            <nav class="dashboard-tabs admin-tabs" aria-label="أقسام الإدارة">
              <button class="tab-action active-tab" data-admin-tab="groups" type="button">المجموعات</button>
              <button class="tab-action" data-admin-tab="users" type="button">المستخدمون</button>
              <button class="tab-action" data-admin-tab="activity" type="button">النشاط</button>
            </nav>
          </div>
        </div>

        <div class="page-body admin-body">

        <section id="adminGroupsPanel" class="admin-card">
          <h2>المجموعات</h2>
          <p class="admin-hint">كل مجموعة فيها أعضاء وأنشطة، وكل عضو تظهر له أنشطة مجموعته تلقائيًا.</p>
          <form class="inline-form" id="createGroupForm">
            <input name="groupName" maxlength="60" required placeholder="اسم المجموعة، مثل: الأول الابتدائي" aria-label="اسم المجموعة">
            <button class="primary-action" type="submit">مجموعة جديدة</button>
          </form>
          <p class="form-message" id="createGroupMessage"></p>
          <div id="adminGroupsList" class="admin-users-list"></div>
        </section>

        <section id="adminUsersPanel" class="admin-grid" hidden>
          <form class="admin-card" id="createUserForm">
            <h2>مستخدم جديد</h2>
            <label>
              <span>اسم المستخدم</span>
              <input name="username" required>
            </label>
            <label>
              <span>الاسم الظاهر</span>
              <input name="displayName" required>
            </label>
            <label>
              <span>كلمة المرور</span>
              <input name="password" type="password" required>
            </label>
            <label>
              <span>الصلاحية</span>
              <select name="role">
                <option value="user">طفل</option>
                <option value="admin">مدير</option>
              </select>
            </label>
            <fieldset id="newUserGroups" hidden></fieldset>
            <fieldset id="newUserAssignments">
              <legend>الأنشطة المتاحة</legend>
            </fieldset>
            <button class="primary-action" type="submit">إنشاء المستخدم</button>
            <p class="form-message" id="createUserMessage"></p>
          </form>

          <section class="admin-card users-card">
            <h2>المستخدمون</h2>
            <div class="admin-filter" data-admin-filter="users">
              <input type="search" placeholder="ابحث بالاسم أو اسم المستخدم" aria-label="ابحث عن مستخدم">
              <select aria-label="تصفية حسب المجموعة"></select>
            </div>
            <p class="progress-meta" id="adminUsersCount"></p>
            <div id="adminUsersList" class="admin-users-list"></div>
          </section>
        </section>

        <section id="adminActivityPanel" class="admin-card activity-card" hidden>
          <h2>النشاط</h2>
          <div class="admin-filter" data-admin-filter="activity">
            <input type="search" placeholder="ابحث بالاسم أو اسم المستخدم" aria-label="ابحث في النشاط">
            <select aria-label="تصفية حسب المجموعة"></select>
          </div>
          <div id="adminActivityList" class="activity-list"></div>
        </section>
        </div>
      </section>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=4"></script>
    <script src="script.js?v=43"></script>
  </body>
</html>
