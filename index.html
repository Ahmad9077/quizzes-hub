<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="هيا نتعلم: صفحة خاصة لكل طفل فيها اختباراته وقصصه.">
    <title>هيا نتعلم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&display=swap">
    <link rel="stylesheet" href="styles.css?v=18">
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-screen">
        <p>جاري التحميل…</p>
      </section>
    </main>

    <template id="setupTemplate">
      <section class="auth-layout">
        <article class="auth-card setup-card">
          <div>
            <p class="brand">هيا نتعلم</p>
            <h1>الإعداد مطلوب</h1>
          </div>
          <p>أضف رابط Supabase والمفتاح العام في <code>config.js</code>، ثم شغّل ملفات SQL ووظيفة Edge الموجودة في مجلد <code>supabase</code>.</p>
          <a class="primary-action" href="README.md">ملاحظات الإعداد</a>
        </article>
      </section>
    </template>

    <template id="loginTemplate">
      <section class="auth-layout">
        <div class="auth-panel">
          <div class="auth-copy">
            <div>
              <p class="brand">هيا نتعلم</p>
              <h1>هيا نلعب ونتعلم!</h1>
              <p class="hero-copy">صفحة مرحة لكل طفل، توصله بسرعة لاختباراته وقصصه.</p>
            </div>
            <div class="trivia-board" aria-hidden="true">
              <span class="trivia-card card-main">
                <b>أعلام</b>
                <i>الدول</i>
              </span>
              <span class="trivia-card card-dark">
                <b>خرائط</b>
                <i>العالم</i>
              </span>
              <span class="trivia-card card-yellow">
                <b>كلمات</b>
                <i>تهجئة</i>
              </span>
              <span class="trivia-card card-light">
                <b>علوم</b>
                <i>الصف الأول</i>
              </span>
            </div>
          </div>
          <form class="auth-card" id="loginForm">
            <div class="form-heading">
              <h2>تسجيل الدخول</h2>
              <p>اكتب اسم المستخدم وكلمة المرور.</p>
            </div>
            <label>
              <span>اسم المستخدم</span>
              <input name="username" autocomplete="username" required>
            </label>
            <label>
              <span>كلمة المرور</span>
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <button class="primary-action" type="submit">دخول</button>
            <p class="form-message" id="loginMessage"></p>
          </form>
        </div>
      </section>
    </template>

    <template id="dashboardTemplate">
      <section class="dashboard">
        <header class="topbar">
          <p class="brand">هيا نتعلم</p>
          <div class="topbar-actions">
            <button class="ghost-action" id="adminViewButton" type="button" hidden>الإدارة</button>
            <button class="ghost-action" id="logoutButton" type="button">تسجيل الخروج</button>
          </div>
        </header>

        <section class="student-hero">
          <div>
            <p class="student-kicker">صفحتي</p>
            <h1 id="dashboardTitle" class="page-title"></h1>
          </div>
          <div class="profile-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <nav class="dashboard-tabs" aria-label="أقسام الصفحة">
            <button class="tab-action active-tab" id="quizzesTabButton" type="button">الأنشطة</button>
            <button class="tab-action" id="challengeTabButton" type="button">التحدي</button>
          </nav>
        </section>

        <section id="quizzesPanel">
          <h2 class="section-title">اختر اختبارا أو قصة</h2>
          <div class="quiz-grid" id="assignedQuizGrid"></div>
        </section>

        <section id="challengePanel" hidden>
          <h2 class="section-title">وضع التحدي</h2>
          <div class="challenge-layout">
            <section class="challenge-card">
              <h3>ابدأ تحديا</h3>
              <form id="createChallengeForm" class="challenge-form">
                <label>
                  <span>الاختبار</span>
                  <select id="challengeQuizSelect" name="quizId" required></select>
                </label>
                <button class="primary-action" type="submit">أنشئ جلسة</button>
              </form>
              <p class="form-message" id="challengeCreateMessage"></p>
            </section>
          </div>

          <section class="challenge-card" id="activeChallengeCard" hidden>
            <div id="activeChallenge"></div>
          </section>

          <section class="challenge-card">
            <div class="section-heading-row">
              <h3>الجلسات المفتوحة</h3>
              <button class="mini-action" id="refreshChallengesButton" type="button">تحديث</button>
            </div>
            <div class="challenge-list" id="openChallengesList"></div>
          </section>
        </section>
      </section>
    </template>

    <template id="quizTileTemplate">
      <a class="quiz-tile">
        <span class="quiz-icon" aria-hidden="true"></span>
        <span class="quiz-name"></span>
        <span class="start-pill">ابدأ</span>
      </a>
    </template>

    <template id="quranTileTemplate">
      <a class="quiz-tile quran-tile" href="quran/" lang="ar" dir="rtl" aria-label="القرآن الكريم — اختر السورة">
        <svg class="quiz-icon quran-thumbnail" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 17c-7-5-16-6-25-3v35c9-3 18-2 25 3 7-5 16-6 25-3V14c-9-3-18-2-25 3Zm0 0v35"/><path d="M15 24c4-1 7 0 10 2m-10 7c4-1 7 0 10 2m14-9c3-2 6-3 10-2m-10 11c3-2 6-3 10-2"/></svg>
        <span class="quiz-name">القرآن الكريم</span>
        <span class="start-pill">اختر السورة</span>
      </a>
    </template>

    <template id="storiesTileTemplate">
      <a class="quiz-tile stories-tile" href="prophets-stories.html" lang="ar" dir="rtl" aria-label="قصص الأنبياء — افتح القصص الخمس عشرة">
        <img class="quiz-icon stories-thumbnail" src="story-thumbnails/valley.webp" width="62" height="62" alt="">
        <span class="quiz-name">قصص الأنبياء</span>
        <span class="start-pill">افتح القصص · 15</span>
      </a>
    </template>

    <template id="adminTemplate">
      <section class="dashboard admin-dashboard">
        <header class="topbar">
          <p class="brand">هيا نتعلم</p>
          <div class="topbar-actions">
            <button class="ghost-action" id="backToDashboardButton" type="button">صفحتي</button>
            <button class="ghost-action" id="adminLogoutButton" type="button">تسجيل الخروج</button>
          </div>
        </header>

        <h1 class="page-title">الإدارة</h1>

        <section class="admin-grid">
          <form class="admin-card" id="createUserForm">
            <h2>مستخدم جديد</h2>
            <label>
              <span>اسم المستخدم</span>
              <input name="username" required>
            </label>
            <label>
              <span>الاسم الظاهر</span>
              <input name="displayName" required>
            </label>
            <label>
              <span>كلمة المرور</span>
              <input name="password" type="password" required>
            </label>
            <label>
              <span>الصلاحية</span>
              <select name="role">
                <option value="user">طفل</option>
                <option value="admin">مدير</option>
              </select>
            </label>
            <fieldset id="newUserAssignments">
              <legend>الأنشطة المتاحة</legend>
            </fieldset>
            <button class="primary-action" type="submit">إنشاء المستخدم</button>
            <p class="form-message" id="createUserMessage"></p>
          </form>

          <section class="admin-card users-card">
            <h2>المستخدمون</h2>
            <div id="adminUsersList" class="admin-users-list"></div>
          </section>
        </section>

        <section class="admin-card activity-card">
          <h2>النشاط</h2>
          <div id="adminActivityList" class="activity-list"></div>
        </section>
      </section>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=4"></script>
    <script src="script.js?v=34"></script>
  </body>
</html>
