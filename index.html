<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#79c6ff">
    <meta name="description" content="هيا نتعلم: التربية الإسلامية، اللغة العربية، English، الرياضيات، العلوم، الاجتماعيات.">
    <title>هيا نتعلم</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2379c6ff'/%3E%3Ccircle cx='16' cy='14' r='7' fill='%23ffcb2e'/%3E%3Cpath d='M0 26q8-5 16-1t16-2v9H0z' fill='%23f3bd7c'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Rubik:wght@800&display=swap">
    <link rel="stylesheet" href="styles.css?v=21">
  </head>
  <body class="boot" data-screen="loading" data-mood="morning">
    <div class="sky" aria-hidden="true">
      <div class="tones"><div class="tone morning"></div><div class="tone noon"></div><div class="tone sunset"></div><div class="tone night"></div></div>
      <div class="stars"></div>
      <div class="cloud" style="--y:38px;--t:96s;--dl:-20s"></div>
      <div class="cloud" style="--y:104px;--t:132s;--dl:-84s;--k:.7"></div>
      <div class="cloud" style="--y:66px;--t:114s;--dl:-58s;--k:1.25"></div>
      <div class="sky-birds"><svg viewBox="0 0 34 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M2 12q7-10 15 0q8-10 15 0"/></svg><svg viewBox="0 0 34 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M2 12q7-10 15 0q8-10 15 0"/></svg><svg viewBox="0 0 34 16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M2 12q7-10 15 0q8-10 15 0"/></svg></div>
      <div class="sky-shoot"></div>
      <div class="orb"><div class="orb-in"><div class="sun"></div><div class="moon"></div></div></div>
      <div class="skyline"><div class="skyline-in">
        <svg class="dunes" viewBox="0 0 400 84" preserveAspectRatio="none">
          <path class="dune-far" d="M0 52C60 22 122 24 192 46S322 74 400 34V84H0Z"/>
          <path class="dune-near" d="M0 72C78 44 150 56 222 68S342 54 400 64V84H0Z"/>
        </svg>
        <svg class="palm" viewBox="0 0 60 80" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M30 78C29 62 31 48 33 37"/><path d="M33 36C24 26 14 26 6 32M33 36C26 22 18 16 10 16M33 36c0-14 3-22 9-28M33 36c9-12 19-14 25-8M33 36c11-6 19-2 23 6M33 36c-9-2-17 2-21 10"/></svg>
        <svg class="palm small" viewBox="0 0 60 80" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M30 78C29 62 31 48 33 37"/><path d="M33 36C24 26 14 26 6 32M33 36C26 22 18 16 10 16M33 36c0-14 3-22 9-28M33 36c9-12 19-14 25-8M33 36c11-6 19-2 23 6M33 36c-9-2-17 2-21 10"/></svg>
      </div></div>
    </div>
    <main id="app" class="app-shell" aria-live="polite">
      <section class="loading-screen">
        <p>جاري التحميل…</p>
      </section>
    </main>

    <div class="launch" id="launch" hidden>
      <div class="launch-top"><div class="launch-scene"></div></div>
      <div class="launch-ground">
        <h2 class="launch-name"></h2>
        <div class="launch-load"><span class="dots"><i></i><i></i><i></i></span><p class="launch-line"></p></div>
      </div>
    </div>
    <div class="fx" id="fx" aria-hidden="true"></div>

    <template id="setupTemplate">
      <section class="auth-layout">
        <article class="auth-card setup-card">
          <div>
            <p class="brand">هيا نتعلم</p>
            <h1>الإعداد مطلوب</h1>
          </div>
          <p>أضف رابط Supabase والمفتاح العام في <code>config.js</code>، ثم شغّل ملفات SQL ووظيفة Edge الموجودة في مجلد <code>supabase</code>.</p>
          <a class="primary-action" href="README.md">ملاحظات الإعداد</a>
        </article>
      </section>
    </template>

    <template id="loginTemplate">
      <section class="login screen arrive">
        <div class="login-hero wrap">
          <h1 class="brand"><span class="brand-word">هيا نتعلم</span>
            <svg class="swoosh" viewBox="0 0 220 18" aria-hidden="true"><path d="M6 12C60 2 152 2 214 10" pathLength="1"/></svg>
          </h1>
          <ul class="subjects" aria-label="المواد">
            <li class="book" style="--a:#0f8f86;--d:#075453;--i:0"><span class="bubble" aria-hidden="true"><svg viewBox="0 0 40 40"><g class="s-rock"><path d="M19.8 8.2A12 12 0 1 0 31.3 25.2 10.2 10.2 0 0 1 19.8 8.2Z" fill="#fff"/></g><path class="tw" d="M28 9l1.2 3 3 1.2-3 1.2L28 17.4l-1.2-3-3-1.2 3-1.2z" fill="#ffd86b"/></svg></span><span class="name">التربية الإسلامية</span></li>
            <li class="book" style="--a:#ff7257;--d:#9a2a15;--i:1"><span class="bubble" aria-hidden="true"><span class="hops"><i>أ</i><i style="animation-delay:.22s">ب</i></span></span><span class="name">اللغة العربية</span></li>
            <li class="book" style="--a:#7b68f5;--d:#4331a8;--i:2"><span class="bubble" aria-hidden="true"><span class="hops" dir="ltr"><i>A</i><i style="animation-delay:.22s">b</i><i style="animation-delay:.44s">c</i></span></span><span class="name">English</span></li>
            <li class="book" style="--a:#ffa52e;--d:#8f4500;--i:3"><span class="bubble" aria-hidden="true"><span class="hops" dir="ltr"><i>١</i><i style="animation-delay:.22s">٢</i><i style="animation-delay:.44s">٣</i></span></span><span class="name">الرياضيات</span></li>
            <li class="book" style="--a:#4ccb6b;--d:#115a2a;--i:4"><span class="bubble" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 34V19" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path class="s-leaf l" d="M20 26c-6.5 0-10-3.8-10.6-9.4C15.8 16.6 20 20 20 26z" fill="#fff"/><path class="s-leaf r" d="M20 19c0-6.6 4.4-10.6 11-11.2C31 14.6 26.6 19 20 19z" fill="#fff"/></svg></span><span class="name">العلوم</span></li>
            <li class="book" style="--a:#45a9ff;--d:#114f98;--i:5"><span class="bubble" aria-hidden="true"><svg viewBox="0 0 40 40" fill="#fff"><polygon points="18.4,35 21.6,35 20.5,5 19.5,5"/><ellipse cx="20" cy="19.5" rx="5.4" ry="4.5"/><ellipse cx="20" cy="11.2" rx="2.9" ry="2.5"/><polygon points="27.6,35 30.2,35 29.3,12 28.5,12"/><ellipse cx="28.9" cy="22.5" rx="4.3" ry="3.6"/><polygon points="10.6,35 12.4,35 11.8,16 11.2,16"/><circle class="s-blink" cx="20" cy="4" r="2" fill="#ffd86b"/><circle class="s-blink b" cx="28.9" cy="11" r="1.7" fill="#ffd86b"/></svg></span><span class="name">الاجتماعيات</span></li>
          </ul>
        </div>
        <div class="sheet login-sheet">
          <form class="login-form wrap" id="loginForm">
            <div class="field">
              <label for="loginUsername">اسم المستخدم</label>
              <input id="loginUsername" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            </div>
            <div class="field">
              <label for="loginPassword">كلمة المرور</label>
              <span class="input-wrap">
                <input id="loginPassword" class="pw" name="password" type="password" autocomplete="current-password" required>
                <button class="eye" id="togglePassword" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false"></button>
              </span>
            </div>
            <button class="btn primary wide go" type="submit">دخول</button>
            <p class="form-message" id="loginMessage" role="status"></p>
          </form>
        </div>
      </section>
    </template>

    <template id="dashboardTemplate">
      <section class="dashboard home screen arrive">
        <header class="top wrap">
          <div class="bar">
            <p class="brand-sm">هيا نتعلم</p>
            <button class="avatar-btn" id="avatarButton" type="button" aria-label="حسابي" aria-haspopup="dialog"></button>
          </div>
          <div class="hello">
            <p class="hello-small" id="helloSmall"></p>
            <h1 class="hello-big" id="dashboardTitle"></h1>
          </div>
        </header>

        <div class="sheet"><div class="wrap">
          <section id="quizzesPanel" class="panel enter">
            <h2 class="sec">شنو نتعلم اليوم؟</h2>
            <div class="quiz-grid" id="assignedQuizGrid"></div>
          </section>

          <section id="challengePanel" class="panel" hidden>
            <div class="challenge-cols">
              <div class="challenge-start">
                <section class="challenge-card ch-card">
                  <h2 class="sec">ابدأ تحدي جديد</h2>
                  <p class="hint">اختر المادة، وبعدها يدخل معك لاعب ثاني.</p>
                  <div class="chips" id="challengeChips" role="radiogroup" aria-label="الاختبار"></div>
                  <form id="createChallengeForm" class="challenge-form">
                    <label class="quiet-select">
                      <span>الاختبار</span>
                      <select id="challengeQuizSelect" name="quizId" required></select>
                    </label>
                    <button class="btn primary wide" type="submit">أنشئ جلسة</button>
                  </form>
                  <p class="form-message" id="challengeCreateMessage"></p>
                </section>
                <section class="challenge-card ch-live" id="activeChallengeCard" hidden>
                  <div id="activeChallenge"></div>
                </section>
              </div>
              <section class="challenge-open">
                <div class="section-heading-row row-head">
                  <h2 class="sec">الجلسات المفتوحة</h2>
                  <button class="icon-btn" id="refreshChallengesButton" type="button" aria-label="تحديث"></button>
                </div>
                <div class="challenge-list ch-list" id="openChallengesList"></div>
              </section>
            </div>
          </section>
        </div></div>

        <nav class="dock dashboard-tabs" aria-label="أقسام الصفحة">
          <span class="pill" aria-hidden="true"></span>
          <button class="tab-action active-tab" id="quizzesTabButton" type="button" aria-current="page"></button>
          <button class="tab-action" id="challengeTabButton" type="button"></button>
        </nav>

        <div class="modal" id="accountSheet" hidden>
          <div class="backdrop" data-close></div>
          <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="accountName">
            <span class="av" id="accountAvatar" aria-hidden="true"></span>
            <h2 id="accountName"></h2>
            <p>هذي صفحتك في هيا نتعلم</p>
            <button class="btn quiet wide" id="adminViewButton" type="button" hidden>الإدارة</button>
            <button class="btn quiet wide" id="logoutButton" type="button">تسجيل الخروج</button>
            <button class="btn plain" type="button" data-close>إغلاق</button>
          </div>
        </div>
      </section>
    </template>

    <template id="quizTileTemplate">
      <a class="quiz-tile">
        <span class="quiz-icon" aria-hidden="true"></span>
        <span class="foot"><span class="quiz-name"></span><span class="go-arrow" aria-hidden="true"></span></span>
      </a>
    </template>

    <template id="quranTileTemplate">
      <a class="quiz-tile tile quran-tile" href="quran/" lang="ar" dir="rtl" aria-label="القرآن الكريم — اختر السورة" style="--a:#0f8a62;--g:#0b6c4c;--d:#08533a" data-glyph="quran">
        <span class="quiz-icon ico" aria-hidden="true"></span>
        <span class="t"><span class="quiz-name">القرآن الكريم</span><small class="start-pill">اختر السورة</small></span>
      </a>
    </template>

    <template id="storiesTileTemplate">
      <a class="quiz-tile tile stories-tile" href="prophets-stories.html" lang="ar" dir="rtl" aria-label="قصص الأنبياء — افتح القصص الخمس عشرة" style="--a:#e9568f;--g:#c93b74;--d:#a12a5b" data-glyph="stories">
        <span class="quiz-icon ico" aria-hidden="true"></span>
        <span class="t"><span class="quiz-name">قصص الأنبياء</span><small class="start-pill">١٥ قصة</small></span>
      </a>
    </template>

    <template id="adminTemplate">
      <section class="dashboard admin-dashboard page-screen screen arrive">
        <header class="page-head"><div class="wrap">
          <div class="page-bar">
            <button class="pill-btn" id="backToDashboardButton" type="button">صفحتي</button>
            <button class="pill-btn" id="adminLogoutButton" type="button">تسجيل الخروج</button>
          </div>
          <div class="page-title-row"><div><p class="page-kicker">للأهل</p><h1 class="page-title">الإدارة</h1></div></div>
          <nav class="admin-tabs seg-tabs" aria-label="أقسام الإدارة">
            <span class="pill" aria-hidden="true"></span>
            <button class="tab-action active-tab" data-admin-tab="groups" type="button" aria-pressed="true">المجموعات</button>
            <button class="tab-action" data-admin-tab="users" type="button" aria-pressed="false">المستخدمون</button>
            <button class="tab-action" data-admin-tab="activity" type="button" aria-pressed="false">النشاط</button>
          </nav>
        </div></header>
        <div class="sheet"><div class="wrap admin-body">

        <section id="adminGroupsPanel" class="admin-card">
          <h2>المجموعات</h2>
          <p class="admin-hint">كل مجموعة فيها أعضاء وأنشطة، وكل عضو تظهر له أنشطة مجموعته تلقائيًا.</p>
          <form class="inline-form" id="createGroupForm">
            <input name="groupName" maxlength="60" required placeholder="اسم المجموعة، مثل: الأول الابتدائي" aria-label="اسم المجموعة">
            <button class="primary-action" type="submit">مجموعة جديدة</button>
          </form>
          <p class="form-message" id="createGroupMessage"></p>
          <div id="adminGroupsList" class="admin-users-list"></div>
        </section>

        <section id="adminUsersPanel" class="admin-grid" hidden>
          <form class="admin-card" id="createUserForm">
            <h2>مستخدم جديد</h2>
            <label>
              <span>اسم المستخدم</span>
              <input name="username" required>
            </label>
            <label>
              <span>الاسم الظاهر</span>
              <input name="displayName" required>
            </label>
            <label>
              <span>كلمة المرور</span>
              <input name="password" type="password" required>
            </label>
            <label>
              <span>الصلاحية</span>
              <select name="role">
                <option value="user">طفل</option>
                <option value="admin">مدير</option>
              </select>
            </label>
            <fieldset id="newUserGroups" hidden></fieldset>
            <fieldset id="newUserAssignments">
              <legend>الأنشطة المتاحة</legend>
            </fieldset>
            <button class="primary-action" type="submit">إنشاء المستخدم</button>
            <p class="form-message" id="createUserMessage"></p>
          </form>

          <section class="admin-card users-card">
            <h2>المستخدمون</h2>
            <div class="admin-filter" data-admin-filter="users">
              <input type="search" placeholder="ابحث بالاسم أو اسم المستخدم" aria-label="ابحث عن مستخدم">
              <select aria-label="تصفية حسب المجموعة"></select>
            </div>
            <p class="progress-meta" id="adminUsersCount"></p>
            <div id="adminUsersList" class="admin-users-list"></div>
          </section>
        </section>

        <section id="adminActivityPanel" class="admin-card activity-card" hidden>
          <h2>النشاط</h2>
          <div class="admin-filter" data-admin-filter="activity">
            <input type="search" placeholder="ابحث بالاسم أو اسم المستخدم" aria-label="ابحث في النشاط">
            <select aria-label="تصفية حسب المجموعة"></select>
          </div>
          <div id="adminActivityList" class="activity-list"></div>
        </section>
        </div></div>
      </section>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=4"></script>
    <script src="script.js?v=45"></script>
  </body>
</html>
